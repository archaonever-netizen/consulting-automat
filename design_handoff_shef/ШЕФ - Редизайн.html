<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ШЕФ — ИИ-консалтинг</title>
  <link rel="stylesheet" href="redesign/redesign.css">
  <link rel="stylesheet" href="redesign/views.css">
  <link rel="stylesheet" href="redesign/home.css">
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 999; overflow: hidden;
      background: radial-gradient(120% 90% at 50% 42%, #26262A 0%, #1D1D1F 46%, #161618 100%);
      display: grid; place-items: center;
      transition: opacity .7s cubic-bezier(.22,1,.36,1), visibility .7s;
    }
    #splash.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 30px; position: relative; }
    /* bigger so the wordmark reads like the master artwork */
    #splash .s-logo { width: min(78%, 480px); position: relative; z-index: 2; }
    #splash .s-logo svg { width: 100%; height: auto; display: block; overflow: visible; }
    #splash .s-logo .body { fill: #fff; }
    /* black wordmark settles in (gentle iOS spring) */
    #splash .s-logo .body {
      transform-box: fill-box; transform-origin: center;
      opacity: 0; animation: sBody .8s cubic-bezier(.22,1,.36,1) .12s both;
    }
    @keyframes sBody {
      0%   { opacity: 0; transform: translate(-12px, 12px) scale(.985); }
      100% { opacity: 1; transform: none; }
    }
    /* blue tip DRIVES IN along 45° to complete the «Е» middle arm */
    #splash .s-logo .accent {
      transform-box: fill-box; transform-origin: center;
      opacity: 0; animation: sAccent .62s cubic-bezier(.34,1.4,.5,1) .66s both;
    }
    @keyframes sAccent {
      0%   { opacity: 0; transform: translate(-48px, 38px); }
      55%  { opacity: 1; }
      100% { opacity: 1; transform: none; }
    }
    /* blue 45° signature slash — blurred, behind the logo */
    #splash .s-beam {
      position: absolute; top: 50%; left: 50%; z-index: 1; width: 60px; height: 260%;
      transform: translate(-50%, -50%) rotate(45deg) translateX(-300px);
      background: linear-gradient(90deg, transparent, rgba(80,140,255,.8) 50%, transparent);
      filter: blur(11px); opacity: 0; mix-blend-mode: screen;
      animation: sBeam 1.05s cubic-bezier(.32,.72,0,1) .42s both;
    }
    @keyframes sBeam {
      0% { transform: translate(-50%,-50%) rotate(45deg) translateX(-300px); opacity: 0; }
      35% { opacity: 1; } 70% { opacity: 1; }
      100% { transform: translate(-50%,-50%) rotate(45deg) translateX(360px); opacity: 0; }
    }
    #splash .s-tag {
      font-family: 'Manrope', system-ui, sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: .32em; text-indent: .32em;
      color: rgba(255,255,255,.5); position: relative; z-index: 2; white-space: nowrap;
      opacity: 0; transform: translateY(6px);
      animation: sTag .7s cubic-bezier(.22,1,.36,1) 1s both;
    }
    @keyframes sTag { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #splash .s-logo .body, #splash .s-logo .accent { animation: none; opacity: 1; transform: none; }
      #splash .s-beam { display: none; }
      #splash .s-tag { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#1D1D1F">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#1D1D1F"/>
      <text x="600" y="450" font-family="Manrope, sans-serif" font-size="200" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-8">ШЕФ</text>
      <rect x="470" y="500" width="260" height="14" rx="7" fill="#2563EB" transform="rotate(-45 600 507)"/>
    </svg>
  </template>
  <div id="splash">
    <div class="splash-inner">
      <div class="s-logo" id="splashLogo"></div>
      <div class="s-beam"></div>
      <div class="s-tag">ИИ-КОНСАЛТИНГ</div>
    </div>
  </div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="redesign/logo.js"></script>
  <script src="redesign/data.js"></script>
  <script type="text/babel" src="redesign/icons.jsx"></script>
  <script type="text/babel" src="redesign/viz.jsx"></script>
  <script type="text/babel" src="redesign/Sidebar.jsx"></script>
  <script type="text/babel" src="redesign/HomeView.jsx"></script>
  <script type="text/babel" src="redesign/ChatHome.jsx"></script>
  <script type="text/babel" src="redesign/ClientsList.jsx"></script>
  <script type="text/babel" src="redesign/ClientDetail.jsx"></script>
  <script type="text/babel" src="redesign/App.jsx"></script>

  <script>
    // Splash: inject logo, fade after content mounts
    (function () {
      var sl = document.getElementById('splashLogo');
      if (window.SHEF_LOGO && sl) sl.innerHTML = window.SHEF_LOGO;
      function hide() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('gone'); setTimeout(function () { s.remove(); }, 800); }
      }
      var t = setTimeout(hide, 2600);
      // also hide once react root has children
      var iv = setInterval(function () {
        var r = document.getElementById('root');
        if (r && r.children.length) { clearTimeout(t); clearInterval(iv); setTimeout(hide, 1900); }
      }, 100);
    })();
  </script>
</body>
</html>
