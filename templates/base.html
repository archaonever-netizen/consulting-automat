<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Шеф-консалтинг{% endblock %}</title>

  <!-- Мгновенное скрытие splash при наличии флага сессии -->
  <script>
    if (sessionStorage.getItem('splash_shown')) {
      var style = document.createElement('style');
      style.textContent = '#splash-screen { display: none !important; }';
      document.head.appendChild(style);
    }
  </script>

  <!-- Шрифты: Manrope (заголовки/интерфейс) + Inter (текст) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Favicon монограмма ШЕФ -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/mono.svg') }}">

  <!-- Стили -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  {% block head %}{% endblock %}
</head>
<body>

  <!-- ======================================================
       Splash Screen (первый визит в сессии)
       ====================================================== -->
  <div id="splash-screen">
    <div class="splash-logo">
      <svg viewBox="0 -18 720 236" xmlns="http://www.w3.org/2000/svg" aria-label="ШЕФ" role="img">
        <g class="body" fill="#fff">
          <!-- Ш -->
          <path d="M0 0H48V200H0Z"/>
          <path d="M0 155H160L120 200H0Z"/>
          <path d="M82 155V96L128 58V155Z"/>
          <path d="M186 0H230V200H148L186 155Z"/>
          <!-- Е -->
          <path d="M268 0H318V200H268Z"/>
          <path d="M268 0H478L438 50H268Z"/>
          <path d="M268 78H352L312 128H268Z"/>
          <path d="M268 150H438L478 200H268Z"/>
          <!-- Ф -->
          <path d="M585 -12H627V212H585Z"/>
          <path fill-rule="evenodd" clip-rule="evenodd"
                d="M508 100A98 82 0 1 0 704 100A98 82 0 1 0 508 100ZM554 100A52 42 0 1 0 658 100A52 42 0 1 0 554 100Z"/>
        </g>
        <path class="accent" d="M352 78H404L364 128H312Z" fill="#2563EB"/>
      </svg>
    </div>
  </div>

  <!-- ======================================================
       App Shell: сайдбар + основной контент
       ====================================================== -->
  <div class="app">

    {% include '_sidebar.html' %}

    <main class="main" id="mainContent">

      <!-- Индикатор загрузки (position: fixed — работает из любого контейнера) -->
      <div class="loading-bar" id="loadingBar"></div>

      <!-- Контейнер для уведомлений -->
      <div id="toastContainer" class="toast-container"></div>

      {% block content %}{% endblock %}

    </main>
  </div><!-- /.app -->

  <!-- ======================================================
       Скрипты
       ====================================================== -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>

  <!-- Модальное окно подтверждения удаления -->
  <div id="deleteModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3 class="modal-title">Подтверждение удаления</h3>
      <p class="modal-text" id="deleteModalMessage"></p>
      <div class="modal-actions">
        <form id="deleteForm" method="POST" action="">
          <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Отмена</button>
          <button type="submit" class="btn btn-danger">Удалить</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function showDeleteModal(clientId, clientName) {
      const modal = document.getElementById('deleteModal');
      const message = document.getElementById('deleteModalMessage');
      const form = document.getElementById('deleteForm');
      message.textContent = 'Вы точно уверены, что хотите удалить клиента «' + clientName + '»?';
      form.action = '/client/' + clientId + '/delete';
      modal.style.display = 'flex';
    }
    function closeDeleteModal() {
      document.getElementById('deleteModal').style.display = 'none';
    }
    window.addEventListener('click', function(e) {
      const modal = document.getElementById('deleteModal');
      if (e.target === modal) modal.style.display = 'none';
    });
  </script>

  {% block scripts %}{% endblock %}

</body>
</html>
