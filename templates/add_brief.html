{% extends "base.html" %}
{% block title %}Добавить брифинг{% endblock %}

{% block content %}
<div class="detail-top">
  <a href="{{ url_for('client_briefs', client_id=client.id) }}" class="back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5"/><path d="m12 5-7 7 7 7"/>
    </svg>
    К клиенту
  </a>
</div>

<div class="detail-body" style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
  <h2 style="margin-bottom: 10px;">Добавить новый брифинг</h2>
  <p style="color: var(--ink-3); margin-bottom: 30px;">{{ client.name }}</p>

  <form method="POST" style="background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 30px;">

    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Выберите тип брифинга:</label>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px;">
      {% for brief in available_briefs %}
      <label style="display: flex; align-items: flex-start; padding: 16px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; background: var(--bg);"
             onmouseover="this.style.borderColor='#2563EB'; this.style.backgroundColor='var(--bg-2)';"
             onmouseout="this.style.borderColor='var(--border)'; this.style.backgroundColor='var(--bg)';">

        <input type="radio" name="brief_type" value="{{ brief.key }}"
               {% if loop.first %}checked{% endif %}
               style="margin-top: 2px; margin-right: 12px; cursor: pointer; width: 18px; height: 18px;">

        <div style="flex: 1;">
          <div style="font-weight: 600; margin-bottom: 4px;">{{ brief.name }}</div>
          <div style="font-size: 13px; color: var(--ink-4);">{{ brief.desc }}</div>
        </div>
      </label>
      {% endfor %}
    </div>

    <div style="display: flex; gap: 12px; margin-top: 30px;">
      <a href="{{ url_for('client_briefs', client_id=client.id) }}" class="btn btn-ghost" style="flex: 1; text-align: center;">
        Отмена
      </a>
      <button type="submit" class="btn btn-primary" style="flex: 1;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Создать брифинг
      </button>
    </div>

  </form>

</div>

{% endblock %}
