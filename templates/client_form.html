{% extends "base.html" %}
{% block title %}{% if edit_mode %}Редактировать клиента{% else %}Новый клиент{% endif %}{% endblock %}

{% block content %}
<div class="page-wrapper" style="max-width: 600px;">
  <h1 class="page-title">{% if edit_mode %}Редактировать{% else %}Новый клиент{% endif %}</h1>
  <div class="card" style="margin-top: 1.5rem;">
    <form method="POST" action="{% if edit_mode %}{{ url_for('edit_client', client_id=client.id) }}{% else %}{{ url_for('add_client') }}{% endif %}">
      <div class="form-group">
        <label class="form-label" for="name">Название компании / ИП / Самозанятый</label>
        <input type="text" id="name" name="name" class="form-input" value="{% if edit_mode %}{{ client.name }}{% endif %}" required autofocus>
      </div>
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <a href="{{ url_for('clients') }}" class="btn btn-secondary">Отмена</a>
        <button type="submit" class="btn btn-primary">
          <span class="spinner"></span>
          <span class="btn-text">{% if edit_mode %}Сохранить{% else %}Создать{% endif %}</span>
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
