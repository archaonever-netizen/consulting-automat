<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — ШЕФ-консалтинг</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/mono.svg') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      padding: 1rem;
    }

    .auth-card {
      max-width: 400px;
      width: 100%;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo svg {
      width: 100px;
      height: 100px;
      margin-bottom: 1rem;
    }

    .auth-logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      color: var(--text-primary);
    }

    .auth-error {
      padding: 0.75rem 1rem;
      background: var(--danger, #E23D32);
      background-opacity: 0.1;
      color: var(--danger, #E23D32);
      border-radius: var(--radius-md, 8px);
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      border-left: 3px solid var(--danger, #E23D32);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .auth-form-button {
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <div class="card">
        <div class="auth-logo">
          <svg viewBox="0 -18 720 236" xmlns="http://www.w3.org/2000/svg" aria-label="ШЕФ" role="img">
            <g fill="currentColor" style="color: var(--text-primary);">
              <path d="M0 0H48V200H0Z"/>
              <path d="M0 155H160L120 200H0Z"/>
              <path d="M82 155V96L128 58V155Z"/>
              <path d="M186 0H230V200H148L186 155Z"/>
              <path d="M268 0H318V200H268Z"/>
              <path d="M268 0H478L438 50H268Z"/>
              <path d="M268 78H352L312 128H268Z"/>
              <path d="M268 150H438L478 200H268Z"/>
              <path d="M585 -12H627V212H585Z"/>
              <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M508 100A98 82 0 1 0 704 100A98 82 0 1 0 508 100ZM554 100A52 42 0 1 0 658 100A52 42 0 1 0 554 100Z"/>
            </g>
            <path d="M352 78H404L364 128H312Z" fill="#2563EB"/>
          </svg>
          <h1>Вход в ШЕФ</h1>
        </div>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" required autofocus>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Пароль</label>
            <input type="password" id="password" name="password" class="form-input" required>
          </div>

          <div class="auth-form-button">
            <button type="submit" class="btn btn-primary" style="width: 100%;">
              <span class="spinner"></span>
              <span class="btn-text">Войти</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
