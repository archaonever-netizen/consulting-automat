version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  celery:
    build:
      context: .
      dockerfile: Dockerfile.celery
    command: celery -A backend.core.celery_app worker --loglevel=info
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./instance/app.db}
    volumes:
      - .:/app

  flower:
    image: mher/flower:2.0
    ports:
      - "5555:5555"
    command: celery -A backend.core.celery_app flower --port=5555
    depends_on:
      - redis
      - celery
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

volumes:
  redis_data:
